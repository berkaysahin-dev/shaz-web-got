<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Sayfa Bulunamadı | Shaz Vision</title>
  <meta name="description" content="Aradığınız sayfa bulunamadı." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #ffffff 40%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }
    p {
      color: #888888;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.75rem;
      background: #ffffff;
      color: #000000;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Sayfa Bulunamadı</h1>
  <p>Aradığınız içerik kaldırılmış veya taşınmış olabilir.</p>
  <a href="/" class="btn">Ana Sayfaya Dön &rarr;</a>
</body>
</html>
